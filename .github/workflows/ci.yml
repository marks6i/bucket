name: CI/CD

on:
  push:
    branches: [ master, rel20, dev* ]
  pull_request:
    branches: [ master, rel20 ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            compiler: msvc
            build_type: Debug
          - os: windows-latest
            compiler: msvc
            build_type: Release
          - os: ubuntu-latest
            compiler: gcc
            arch: x64
            build_type: Debug
          - os: ubuntu-latest
            compiler: gcc
            arch: x64
            build_type: Release
          - os: ubuntu-latest
            compiler: gcc
            arch: arm64
            build_type: Debug
          - os: ubuntu-latest
            compiler: gcc
            arch: arm64
            build_type: Release

    steps:
    - uses: actions/checkout@v3

    - name: Set up CMake
      uses: lukka/get-cmake@latest

    - name: Configure MSVC (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        echo "Setting up MSVC environment..."
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        echo "MSVC environment setup complete"

    - name: Configure CMake
      run: |
        cmake -B ${{github.workspace}}/build \
          -DCMAKE_BUILD_TYPE=${{matrix.build_type}} \
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler == 'gcc' && 'g++' || 'cl.exe' }} \
          -DCMAKE_C_COMPILER=${{ matrix.compiler == 'gcc' && 'gcc' || 'cl.exe' }} \
          -DCMAKE_CXX_STANDARD=20 \
          -DCMAKE_CXX_STANDARD_REQUIRED=ON

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{matrix.build_type}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{matrix.build_type}} --output-on-failure

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}
        path: ${{github.workspace}}/build/ 