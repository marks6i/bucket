name: CI/CD

on:
  push:
    branches:
      - master
      - rel20
      - "dev*"
  pull_request:
    branches:
      - master
      - rel20
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }}, ${{ matrix.compiler }}, ${{ matrix.arch }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            compiler: msvc
            arch: x64
            build_type: Debug

          - os: windows-latest
            compiler: msvc
            arch: x64
            build_type: Release

          - os: ubuntu-latest
            compiler: gcc
            arch: x64
            build_type: Debug

          - os: ubuntu-latest
            compiler: gcc
            arch: x64
            build_type: Release

          - os: ubuntu-24.04-arm
            compiler: gcc
            arch: arm64
            build_type: Debug

          - os: ubuntu-24.04-arm
            compiler: gcc
            arch: arm64
            build_type: Release

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"
          ninjaVersion: "^1.12.0"

      - name: Show runner information
        shell: bash
        run: |
          echo "Runner OS:   $RUNNER_OS"
          echo "Runner arch: $RUNNER_ARCH"
          echo "Workspace:   $GITHUB_WORKSPACE"
          cmake --version
          ninja --version

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show MSVC version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cl.exe 2>&1 | Select-Object -First 3
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"

      - name: Show GCC version
        if: runner.os == 'Linux'
        shell: bash
        run: |
          gcc --version
          g++ --version
          uname -a

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S "$GITHUB_WORKSPACE" \
            -B "$GITHUB_WORKSPACE/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        shell: bash
        run: |
          cmake --build "$GITHUB_WORKSPACE/build" \
            --parallel 2 \
            --verbose

      - name: Test
        shell: bash
        working-directory: ${{ github.workspace }}/build
        run: |
          ctest \
            --output-on-failure \
            --no-tests=error \
            --timeout 300

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.arch }}-${{ matrix.build_type }}
          path: |
            ${{ github.workspace }}/build/
          retention-days: 5
          if-no-files-found: warn

