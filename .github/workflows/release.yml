name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v1

    - name: Build solution
      run: msbuild.exe bucket.sln /p:Configuration=Release /p:Platform=x64

    - name: Archive headers
      run: |
        Compress-Archive -Path include -DestinationPath include.zip

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false

    - name: Upload Release Asset
      id: upload-release-asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./include.zip
        asset_name: include.zip
        asset_content_type: application/zip

  update-gh-pages:
    needs: release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout gh-pages
      uses: actions/checkout@v3
      with:
        ref: gh-pages

    - name: Update index.html
      run: |
        sed -i 's|</ul>|<li><a href="https://github.com/marks6i/bucket/releases/tag/${{ github.ref_name }}">${{ github.ref_name }}</a></li>\n</ul>|' index.html

    - name: Commit and push
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "Update gh-pages with new release"
        branch: gh-pages
